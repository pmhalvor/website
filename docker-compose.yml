services:
  home:
    build:
      context: .
      dockerfile: Dockerfile.home
    container_name: home
    image: ghcr.io/pmhalvor/website:${TAG}
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      DEBUG: "false"
    volumes:
      - ./home/protected:/home/protected
    platform: linux/amd64

